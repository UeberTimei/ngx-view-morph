@if (destination; as d) {
<article class="page">
  <figure class="stage">
    <img
      class="hero"
      [src]="d.photo"
      [alt]="d.title + ', ' + d.place"
      [style.--photo-ratio]="d.ratio"
      [morph]="'dest-' + d.slug"
      morphClass="morph-cover"
    />
    <button class="back" type="button" (click)="back()">
      ← All destinations
    </button>
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.018"
          numOctaves="2"
          seed="3"
          result="noise"
        />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="soft"
          scale="22"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <figcaption class="caption">
      <p class="place">{{ d.place }}</p>
      <h1>{{ d.title }}</h1>
    </figcaption>
  </figure>
  <div class="text">
    <p class="blurb">{{ d.blurb }}</p>
    @for (p of d.body; track p) {
    <p class="body">{{ p }}</p>
    }
  </div>
</article>
}
