<h1>Auto names</h1>
<p class="hint">
  Rows use <code>morph="auto"</code>: no ids, the browser names each element
  (<code>view-transition-name: match-element</code>, Chrome 137+). Shuffle and remove still
  animate because <code>&#64;for</code> keeps the DOM elements.
</p>

<div class="actions">
  <button mat-flat-button (click)="add()">+ Add to top</button>
  <button mat-stroked-button (click)="shuffle()">Shuffle</button>
</div>

<ul class="list">
  @for (item of items(); track item.id) {
  <li class="row" morph="auto">
    <span>{{ item.label }}</span>
    <button mat-icon-button aria-label="Remove" (click)="remove(item.id)">
      <mat-icon>close</mat-icon>
    </button>
  </li>
  }
</ul>
