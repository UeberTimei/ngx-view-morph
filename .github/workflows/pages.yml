name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx ng build demo --base-href ${{ env.BASE }}demo/
      - run: bunx vitepress build docs
        env:
          DOCS_BASE: ${{ env.BASE }}
      - name: Assemble site
        run: |
          cp -r dist/demo/browser docs/.vitepress/dist/demo
          # Pages only serves the root 404.html: send /demo/<route> deep links to /demo/?/<route>
          # (restored by the script in the demo's index.html), other misses keep the docs 404 page.
          redirect="<script>(function(l){var b='${BASE}demo/';if(l.pathname.indexOf(b)===0){l.replace(b+'?/'+l.pathname.slice(b.length)+(l.search?'\&'+l.search.slice(1):'')+l.hash)}})(location)</script>"
          sed -i "s|</head>|${redirect}</head>|" docs/.vitepress/dist/404.html
          grep -q "indexOf(b)===0" docs/.vitepress/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deploy
        uses: actions/deploy-pages@v4
